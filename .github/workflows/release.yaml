name: Release
# npm trusted publishing (OIDC): no token. Only `fix:` and `feat:` cut a version.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
on:
  push:
    branches:
      - main
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - name: Release
        run: npx -y semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
